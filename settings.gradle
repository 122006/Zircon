plugins {
    id("org.gradle.toolchains.foojay-resolver") version "0.8.0"
}

rootProject.name = 'Zircon'
include ':javac'
include ':zircon'
include ':base'
include ':gradle_plugin'

if (providers.gradleProperty('centralRelease').isPresent()) {
    // Rebuild all javac adapters without configuring the IDE and demo projects.
    include ':inject_java7', ':inject_java11', ':inject_java16'
} else if (System.getProperty("user.name", "") == "jitpack") {
    System.out.println("build by JITPACK")
} else {
    include ':vscode_plugin'
    include ':vscode_plugin_agent'
    include ':ijplugin'
    include ':ijplugin_223'
    include ':ijplugin_241'
    include ':ijplugin_252'
    include ':ijplugin_252_ex'
    include ':ijplugin_261'
    include ':ijplugin_261_ex'
    include ':ijplugin_mix'
    include ':test'
    include ':inject_java7'
    include ':inject_java11'
    include ':inject_java16'
}


toolchainManagement {
    jvm {
        javaRepositories {
            repository("foojay") {
                resolverClass = org.gradle.toolchains.foojay.FoojayToolchainResolver
            }
        }
    }
}
