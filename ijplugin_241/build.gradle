buildscript {
    repositories {
        maven {
            url uri('../../repo')
        }
        maven { url 'https://jitpack.io' }
    }
}

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.11.0'
}

group 'com.by122006.zircon'
version '4.3'

def localIdea251Path = providers.gradleProperty('zircon.idea251.path').orNull

compileJava {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
buildPlugin {
    buildSearchableOptions.enabled = false
}

repositories {
    maven {
        url uri('../../repo')
    }
    intellijPlatform {
        defaultRepositories()
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()

}
patchPluginXml {
    sinceBuild = "240"
    untilBuild = "252.*"
}
dependencies {
    intellijPlatform {
        if (localIdea251Path) {
            local(localIdea251Path)
        } else {
            intellijIdeaCommunity '2025.1'
        }
//        intellijIdeaCommunity '251.21418.62'
        bundledPlugin 'com.intellij.java'
        instrumentationTools()
    }
    compileOnly files(project(":ijplugin").sourceSets.main.output.classesDirs)
    implementation('com.github.122006:ExMethodUtil:1.1.8')
    implementation project(":ijplugin_mix")

    annotationProcessor project(":javac")
    implementation project(":zircon")
    implementation project(":base")
    testAnnotationProcessor project(":javac")

}


tasks.withType(JavaCompile) {
    it.options.compilerArgs << "-Xplugin:ZrOptionalChain"
    it.options.compilerArgs << "-Xplugin:ZrExMethod"
    it.options.compilerArgs << "-Xplugin:ZrString"
    it.options.fork = true
}

compileJava.dependsOn(":ijplugin:compileJava")

tasks.named('buildPlugin').configure {
    enabled = false
    description = 'Disabled: ijplugin_241 is an embedded compatibility adapter.'
}
tasks.named('signPlugin').configure {
    enabled = false
}
tasks.named('publishPlugin').configure {
    enabled = false
}
