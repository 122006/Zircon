buildscript {
    repositories {
        maven {
            url uri('../../repo')
        }
        maven { url 'https://jitpack.io' }
    }
}

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.11.0'
}
//apply plugin: 'zircon'

group 'com.by122006.zircon'
version '4.9'

def localIdea253Path = providers.gradleProperty('zircon.idea253.path').orNull
def localIdea261Path = providers.gradleProperty('zircon.idea261.path').orNull
def localIdea223Path = providers.gradleProperty('zircon.idea223.path').orNull
def localIdea242Path = providers.gradleProperty('zircon.idea242.path').orNull

compileJava {
    // The shipping shell is loaded by every supported IDE, including builds
    // that still run on JBR 11. Version-specific implementations are isolated
    // behind ZrClassLoaderHelper or optional plugin descriptor fragments.
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
buildPlugin {
    buildSearchableOptions.enabled = false
    // IntelliJ Platform Gradle Plugin still exposes a previously generated
    // empty searchable-options JAR as an input when the feature is disabled.
    // Do not let that stale artifact leak into the single release archive.
    exclude '**/*-searchableOptions.jar'
}

sourceSets {
    main {
        // Never rely on ignored/generated files left in the source tree.
        // processResources below embeds freshly compiled legacy adapters.
        resources.exclude 'clazz/**'
    }
}

def legacyParserModules = ['ijplugin_223', 'ijplugin_241']
processResources {
    dependsOn legacyParserModules.collect {
        ":${it}:compileJava"
    }
    legacyParserModules.each { moduleName ->
        from(project(":${moduleName}").layout.buildDirectory.dir('classes/java/main')) {
            into "clazz/${moduleName}"
            include '**/*.class'
            rename { String fileName ->
                fileName.replaceAll(/\.class$/, '.clazz')
            }
        }
    }
}

repositories {
    maven {
        url uri('../../repo')
    }
    intellijPlatform {
        defaultRepositories()
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()

}

import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.TestFrameworkType
intellijPlatform {
    pluginVerification {
        ides {
            if (localIdea223Path) {
                local(project.file(localIdea223Path))
            } else {
                ide IntelliJPlatformType.IntellijIdea, '2022.3.3'
            }
            if (localIdea242Path) {
                local(project.file(localIdea242Path))
            } else {
                ide IntelliJPlatformType.IntellijIdea, '2024.2.1'
            }
            if (localIdea253Path) {
                local(project.file(localIdea253Path))
            } else {
                ide IntelliJPlatformType.IntellijIdea, '2025.3.1.1'
            }
            if (localIdea261Path) {
                local(project.file(localIdea261Path))
            } else {
                ide IntelliJPlatformType.IntellijIdea, '2026.1.4'
            }
        }
    }
}
patchPluginXml {
    sinceBuild = "212"
    untilBuild = "261.*"
}
dependencies {
    intellijPlatform {
        bundledPlugin 'com.intellij.java'
//        intellijIdeaCommunity '2022.3'
//        intellijIdeaCommunity '2024.1'
//        intellijIdeaCommunity '2025.1'
        if (localIdea253Path) {
            local(localIdea253Path)
        } else {
            intellijIdea '2025.3.1.1'
        }
        instrumentationTools()
        testFramework TestFrameworkType.Platform.INSTANCE
        testFramework TestFrameworkType.Plugin.Java.INSTANCE
    }
    annotationProcessor project(":javac")
    implementation project(":zircon")
    implementation project(":base")
    testAnnotationProcessor project(":javac")
    annotationProcessor "org.projectlombok:lombok:1.18.42"
    compileOnly 'org.projectlombok:lombok:1.18.42'
    implementation('com.github.122006:ExMethodUtil:1.1.8')
    implementation project(":ijplugin_252_ex")
    implementation project(":ijplugin_mix")
    testImplementation 'junit:junit:4.13.2'

}
tasks.findByPath(':ijplugin:runIde').dependsOn(':buildClazzByJava17')
////IU-202.7319.50


tasks.withType(JavaCompile) {
    it.options.compilerArgs << "-Xplugin:ZrOptionalChain"
    it.options.compilerArgs << "-Xplugin:ZrExMethod"
    it.options.compilerArgs << "-Xplugin:ZrString"
    it.options.fork = true
}

