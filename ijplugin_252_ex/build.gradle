buildscript {
    repositories {
        maven {
            url uri('../../repo')
        }
        maven { url 'https://jitpack.io' }
    }
}

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.11.0'
}
group 'com.by122006.zircon'
version '4.9'

def localIdea253Path = providers.gradleProperty('zircon.idea253.path').orNull

compileJava {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
buildPlugin {
    buildSearchableOptions.enabled = false
    prepareJarSearchableOptions.enabled = false
}

repositories {
    maven {
        url uri('../../repo')
    }
    intellijPlatform {
        defaultRepositories()
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()

}
patchPluginXml {
    sinceBuild = "212"
    untilBuild = "261.*"
}
dependencies {
    intellijPlatform {
        if (localIdea253Path) {
            local(localIdea253Path)
        } else {
            intellijIdea '2025.3.1.1'
        }
//        intellijIdeaCommunity '2025.3.1'
        bundledPlugin 'com.intellij.java'
//        instrumentationTools()
    }
    implementation('com.github.122006:ExMethodUtil:1.1.8')
    annotationProcessor "org.projectlombok:lombok:1.18.42"
    compileOnly 'org.projectlombok:lombok:1.18.42'
    implementation project(":ijplugin_mix")

    annotationProcessor project(":javac")
    implementation project(":zircon")
    implementation project(":base")
    testAnnotationProcessor project(":javac")

}


tasks.withType(JavaCompile) {
    it.options.compilerArgs << "-Xplugin:ZrOptionalChain"
    it.options.compilerArgs << "-Xplugin:ZrExMethod"
    it.options.compilerArgs << "-Xplugin:ZrString"
    it.options.fork = true
}

// Modern Syntax API implementation bundled into the one shipping ijplugin ZIP.
// This project is an internal library, never a standalone Marketplace plugin.
tasks.named('buildPlugin').configure {
    enabled = false
    description = 'Disabled: ijplugin_252_ex is an internal modern adapter.'
}
tasks.named('signPlugin').configure {
    enabled = false
}
tasks.named('publishPlugin').configure {
    enabled = false
}
